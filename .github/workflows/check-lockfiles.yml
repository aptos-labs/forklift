name: Check Lockfiles

on:
  pull_request:
  workflow_dispatch:

jobs:
  check-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check all lockfiles
        run: |
          for pkg in forklift testsuite example-tip-jar live-tests; do
            echo "Checking packages/$pkg..."
            cd packages/$pkg
            npm install --package-lock-only --ignore-scripts
            if ! git diff --exit-code package-lock.json; then
              echo "Error: packages/$pkg/package-lock.json is not up to date."
              echo "Please run 'npm install' in packages/$pkg and commit the changes."
              exit 1
            fi
            cd ../..
          done
