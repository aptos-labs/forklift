name: Check Lockfiles

on:
  pull_request:
  workflow_dispatch:

jobs:
  check-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check all lockfiles
        run: ./scripts/check-lockfiles.sh
