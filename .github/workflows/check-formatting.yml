name: Check Formatting

on:
  pull_request:
  workflow_dispatch:

jobs:
  check-formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check all formatting
        run: |
          for pkg in forklift testsuite example-tip-jar live-tests; do
            echo "Checking packages/$pkg..."
            cd packages/$pkg
            npm ci
            npm run format:check
            cd ../..
          done
